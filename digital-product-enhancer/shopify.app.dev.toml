# Development Shopify app config (Codespaces/local tunnel)
# Use a separate Shopify app for dev and set its client_id here.

client_id = "REPLACE_WITH_DEV_CLIENT_ID"
name = "Digital Product Enhancer (Dev)"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_products"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]
