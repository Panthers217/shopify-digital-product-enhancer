services:
  - type: web
    name: digital-product-enhancer
    runtime: node
    rootDir: digital-product-enhancer
    region: oregon
    plan: starter

    buildCommand: npm install && npm run build
    startCommand: npm run docker-start

    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: write_products
headers:
  - path: /*
    name: Content-Security-Policy
    value: frame-ancestors https://rouse-commerce-lab.myshopify.com https://admin.shopify.com;